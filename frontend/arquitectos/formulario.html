<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe6">
  <title>Formulario de arquitecto | Obra Clara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="inner-page architect-page">
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="../index.html" aria-label="Obra Clara, inicio">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>obra clara</span>
      </a>
      <div class="topbar-meta"></div>
      <a class="back-link" href="index.html">← Volver a arquitectos</a>
    </header>

    <section class="page-hero">
      <p class="eyebrow">Directorio profesional</p>
      <h1 id="form-title"><em>Nuevo arquitecto.</em></h1>
      <p id="form-desc">Ingresa los datos del profesional para asociar su matrícula y firma en las planillas y presupuestos.</p>
    </section>

    <section class="workspace">
      <div class="form-panel" style="max-width: 800px; margin: 0 auto;">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Ficha profesional</p>
            <h2 id="form-subtitle">Datos del arquitecto/a</h2>
          </div>
        </div>

        <form id="architect-form" class="directory-form">
          <div class="form-grid">
            <div class="field wide">
              <label for="architect-name">Nombre completo *</label>
              <input type="text" id="architect-name" name="name" placeholder="Ej. Arq. Carolina Méndez" required autocomplete="name">
            </div>

            <div class="field">
              <label for="architect-license">Matrícula profesional *</label>
              <input type="text" id="architect-license" name="license" placeholder="Ej. MP 14.890" required>
            </div>

            <div class="field">
              <label for="architect-cuil">CUIL / CUIT</label>
              <input type="text" id="architect-cuil" name="cuil" placeholder="27-33445566-4" inputmode="numeric" maxlength="13">
            </div>

            <div class="field">
              <label for="architect-phone">Teléfono de contacto</label>
              <input type="tel" id="architect-phone" name="phone" placeholder="Ej. 11 6543 2100" autocomplete="tel">
            </div>

            <div class="field">
              <label for="architect-email">Correo profesional</label>
              <input type="email" id="architect-email" name="email" placeholder="estudio@arquitectura.com" autocomplete="email">
            </div>

            <div class="field wide">
              <label for="architect-address">Estudio / Dirección profesional</label>
              <input type="text" id="architect-address" name="address" placeholder="Ej. Av. San Martín 820, Oficina 4B">
            </div>
          </div>

          <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line);">
            <a href="index.html" class="btn-action-secondary" id="cancel-button">Cancelar / Volver</a>
            <button type="submit" class="btn-action-primary" id="save-button">Guardar arquitecto</button>
          </div>
        </form>
      </div>
    </section>

    <footer class="footer">
      <span>OBRA CLARA / ARQUITECTOS</span>
      <span>Directorio profesional</span>
    </footer>
  </main>

  <script src="../auth.js"></script>
  <script>
    Auth.requireAuth(1);
    Auth.renderTopbar(1);

    const directory = JSON.parse(
      localStorage.getItem('obraClaraDirectory') || '{"clients":[],"architects":[]}'
    );

    const form = document.querySelector('#architect-form');
    const formTitle = document.querySelector('#form-title');
    const formSubtitle = document.querySelector('#form-subtitle');
    const saveButton = document.querySelector('#save-button');
    const nameInput = document.querySelector('#architect-name');
    const licenseInput = document.querySelector('#architect-license');
    const cuilInput = document.querySelector('#architect-cuil');
    const phoneInput = document.querySelector('#architect-phone');
    const emailInput = document.querySelector('#architect-email');
    const addressInput = document.querySelector('#architect-address');

    const params = new URLSearchParams(window.location.search);
    const editIndex = params.has('edit') ? Number(params.get('edit')) : null;

    function formatCuit(value = '') {
      const digits = value.replace(/\D/g, '').slice(0, 11);
      if (digits.length <= 2) return digits;
      if (digits.length <= 10) return `${digits.slice(0, 2)}-${digits.slice(2, 10)}${digits.length > 10 ? '-' + digits.slice(10) : ''}`;
      return `${digits.slice(0, 2)}-${digits.slice(2, 10)}-${digits.slice(10)}`;
    }

    function capitalizeWords(value = '') {
      return value.replace(/(^|[\s'-])([a-záéíóúüñ])/gi, (_, sep, l) => sep + l.toUpperCase());
    }

    cuilInput.addEventListener('input', e => {
      e.target.value = formatCuit(e.target.value);
    });

    nameInput.addEventListener('blur', e => {
      e.target.value = capitalizeWords(e.target.value.trim());
    });

    if (editIndex !== null && directory.architects[editIndex]) {
      const arch = directory.architects[editIndex];
      formTitle.innerHTML = '<em>Modificar arquitecto.</em>';
      formSubtitle.textContent = `Editando: ${arch.name}`;
      saveButton.textContent = 'Guardar cambios';

      nameInput.value = arch.name || '';
      licenseInput.value = arch.license || '';
      cuilInput.value = arch.cuil || '';
      phoneInput.value = arch.phone || '';
      emailInput.value = arch.email || '';
      addressInput.value = arch.address || '';
    }

    form.addEventListener('submit', e => {
      e.preventDefault();

      const archData = {
        name: capitalizeWords(nameInput.value.trim()),
        license: licenseInput.value.trim(),
        cuil: cuilInput.value.trim(),
        phone: phoneInput.value.trim(),
        email: emailInput.value.trim(),
        address: addressInput.value.trim()
      };

      if (editIndex !== null && directory.architects[editIndex]) {
        directory.architects[editIndex] = archData;
      } else {
        directory.architects.push(archData);
        // Set as active profile
        const activeProfiles = JSON.parse(localStorage.getItem('obraClaraActiveProfiles') || '{}');
        activeProfiles.architect = directory.architects.length - 1;
        localStorage.setItem('obraClaraActiveProfiles', JSON.stringify(activeProfiles));
      }

      localStorage.setItem('obraClaraDirectory', JSON.stringify(directory));
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
